<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #fec4dd;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        h1 {
            color: #ff4f9a;
            margin-bottom: 25px;
            text-align: center;
        }
        .video-container {
            width: 95%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .retour {
            margin-top: 30px;
            margin-bottom: 20px;
            padding: 14px 35px;
            background: #ff4f9a;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .retour:hover {
            background: #7c4dff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>🎉 Joyeux Anniversaire Papa 🎂</h1>
    <div class="video-container">
        <iframe 
            src="https://www.youtube.com/embed/82rd8v_Ao80?si=VRr4Z4BnWGMMZZfb"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>
    <button class="retour" onclick="window.location.href='index.html'">
        ⬅️ Retour
    </button>
</body>
</html>
